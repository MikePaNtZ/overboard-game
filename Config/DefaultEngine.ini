[/Script/Engine.RendererSettings]
; MetaHuman skater rider (docs/carve-render.md). The GPU skin cache must be compiled in: a hair
; groom bound to a skinned face follows the animated head only through it. Without it the hair
; stayed at the face's rest pose, behind the bent-forward head (2026-10-04). 16-bit bone indices
; and per-section bone limits are the MetaHuman project requirements.
r.SkinCache.CompileShaders=True
r.SkinCache.DefaultBehavior=1
r.GPUSkin.Support16BitBoneIndex=True
r.GPUSkin.UnlimitedBoneInfluences=True
; OB_Trail (docs/trail-level.md): Nanite Foliage. The PVE trees (quaking aspen, hazel) are Nanite
; skinned meshes whose twigs and leaves are Nanite assembly parts; without this the trees render
; as bare trunks and branches. It also enables voxel shape preservation for the generated grass.
r.Nanite.Foliage=1
